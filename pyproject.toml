[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "player"
version = "0.2.1"
description = "映序：简洁沉浸的桌面播放器，支持本地 AI 实时字幕和目录播放列表"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "rzhu" }]
dependencies = [
    "PySide6>=6.7",
    "mpv>=1.0.6",
    "av>=12.0",
    "faster-whisper>=1.0.0",
    "numpy>=1.26",
    "pyobjc-framework-AVKit>=12.2; sys_platform == 'darwin'",
    "pyobjc-framework-AVFoundation>=12.2; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=12.2; sys_platform == 'darwin'",
]

[project.urls]
Homepage = "https://github.com/huruizhi/yingxu-player"
Repository = "https://github.com/huruizhi/yingxu-player"
Changelog = "https://github.com/huruizhi/yingxu-player/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.0",
    "isort>=5.13",
    "pyinstaller>=6.0",
]

[project.scripts]
player = "player.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.black]
line-length = 110
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 110
src_paths = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: 慢速测试（真实模型下载/转写）"]

[tool.coverage.run]
source = ["src/player"]
omit = ["src/player/ui/*"]
