name: Build and publish macOS release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install libmpv
        run: brew install mpv
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
      - name: Verify and package
        run: make lint test package
      - name: Archive application
        run: ditto -c -k --sequesterRsrc --keepParent dist/Yingxu.app dist/Yingxu-macos-arm64.zip
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/Yingxu-macos-arm64.zip --title "映序 $GITHUB_REF_NAME" --generate-notes
